# Solo compila (debug) y corre los tests JVM. Sin firma, sin secretos y sin publicar nada: los releases se firman y publican
# localmente con tools/release.sh.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests JVM y compilación debug
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
