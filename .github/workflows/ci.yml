# Compila debug y release (validando R8), corre los tests JVM y vigila el tope de tamaño del APK.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests JVM y compilación debug + release
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --console=plain
      - name: Verificar tamaño del APK release
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SIZE=$(wc -c < "$APK")
          echo "Tamaño APK release: $SIZE bytes ($((SIZE / 1024)) KB)"
          [ "$SIZE" -le 972800 ] || { echo "::error::APK supera los 950 KB ($SIZE bytes)"; exit 1; }
